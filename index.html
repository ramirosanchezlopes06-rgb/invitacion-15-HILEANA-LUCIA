<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mis 15 años</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 35%, #0d2342 0%, #071322 35%, #020305 75%, #000000 100%);
    font-family:'Montserrat',sans-serif;
    color:#ffffff;
}

/* =========================
   LUCES DE FONDO
========================= */

.luces{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.luz{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#dcecff;
    box-shadow:
        0 0 8px #5fa9ff,
        0 0 18px rgba(60,140,255,.7);
    animation:flotar 5s infinite ease-in-out;
}

.luz:nth-child(1){left:12%;top:20%;animation-delay:0s;}
.luz:nth-child(2){left:82%;top:18%;animation-delay:1s;}
.luz:nth-child(3){left:22%;top:76%;animation-delay:2s;}
.luz:nth-child(4){left:75%;top:70%;animation-delay:3s;}
.luz:nth-child(5){left:50%;top:12%;animation-delay:1.5s;}
.luz:nth-child(6){left:90%;top:55%;animation-delay:2.5s;}

@keyframes flotar{
    0%,100%{
        transform:translateY(0);
        opacity:.2;
    }

    50%{
        transform:translateY(-25px);
        opacity:1;
    }
}

/* =========================
   PORTADA
========================= */

.portada{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:10;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.portada.oculta{
    opacity:0;
    visibility:hidden;
}

/* =========================
   TEXTO SUPERIOR
========================= */

.texto-superior{
    font-family:'Cormorant Garamond',serif;

    font-size:22px;
    letter-spacing:3px;

    text-align:center;

    margin-bottom:38px;

    color:#f4f8ff;

    text-shadow:
        0 0 12px rgba(70,150,255,.35);
}

/* =========================
   SOBRE
========================= */

.sobre{
    position:relative;

    width:330px;
    height:220px;

    cursor:pointer;

    perspective:1000px;

    filter:
        drop-shadow(0 25px 35px rgba(0,0,0,.7))
        drop-shadow(0 0 18px rgba(17,67,120,.35));

    transition:
        transform .4s ease;
}

.sobre:hover{
    transform:translateY(-8px);
}

/* =========================
   BASE DEL SOBRE
========================= */

.base{
    position:absolute;

    inset:0;

    background:
        linear-gradient(
            145deg,
            #102e52,
            #0b203b 50%,
            #071322
        );

    border:1px solid rgba(106,164,226,.55);

    border-radius:5px;

    overflow:hidden;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,.55),
        0 0 20px rgba(25,90,160,.18);
}

/* TRIÁNGULOS DEL SOBRE */

.base::before{
    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:0;

    border-style:solid;

    border-width:110px 165px 0 0;

    border-color:
        #0d2949
        transparent
        transparent
        transparent;
}

.base::after{
    content:"";

    position:absolute;

    right:0;
    bottom:0;

    width:0;
    height:0;

    border-style:solid;

    border-width:0 165px 110px 0;

    border-color:
        transparent
        #081a30
        transparent
        transparent;
}

/* =========================
   HOJA INTERIOR
========================= */

.hoja{
    position:absolute;

    left:30px;
    right:30px;
    bottom:10px;

    height:190px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #edf5ff
        );

    border-radius:3px;

    transition:
        transform .9s ease;

    box-shadow:
        0 0 25px rgba(0,0,0,.4);
}

/* =========================
   TAPA DEL SOBRE
========================= */

.tapa{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:115px;

    background:
        linear-gradient(
            145deg,
            #173e69,
            #0d2949 55%,
            #081b31
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:top center;

    transition:
        transform 1s cubic-bezier(.4,0,.2,1);

    z-index:5;

    border-top:1px solid rgba(125,183,241,.5);
}

/* =========================
   SELLO
========================= */

.sello{
    position:absolute;

    z-index:8;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:68px;
    height:68px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #174b7d,
            #0b2949 65%,
            #061426
        );

    border:2px solid #91c7ff;

    display:flex;

    justify-content:center;
    align-items:center;

    font-family:'Cormorant Garamond',serif;

    font-size:27px;

    color:#ffffff;

    box-shadow:
        0 0 12px rgba(72,151,230,.65),
        0 5px 18px rgba(0,0,0,.5);

    transition:
        opacity .4s ease,
        transform .5s ease;
}

/* =========================
   TEXTO DEL SOBRE
========================= */

.texto-sobre{
    position:absolute;

    bottom:-55px;

    width:100%;

    text-align:center;

    font-size:11px;

    letter-spacing:3px;

    color:#bcdcff;

    text-transform:uppercase;

    animation:pulso 2s infinite;
}

@keyframes pulso{

    0%,100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }
}

/* =========================
   ANIMACIÓN DE APERTURA
========================= */

.sobre.abierto .tapa{
    transform:rotateX(180deg);
    z-index:1;
}

.sobre.abierto .sello{
    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.5);
}

.sobre.abierto .hoja{
    transform:translateY(-90px);
}

/* =========================
   MENSAJE FINAL
========================= */

.mensaje{
    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    opacity:0;
    visibility:hidden;

    transform:scale(.95);

    transition:
        all 1.2s ease;

    z-index:2;
}

.mensaje.visible{
    opacity:1;

    visibility:visible;

    transform:scale(1);
}

.contenido{
    padding:30px;
}

.pequeno{
    font-family:'Cormorant Garamond',serif;

    font-size:25px;

    color:#b9d9ff;

    letter-spacing:4px;
}

.numero{
    font-family:'Cormorant Garamond',serif;

    font-size:115px;

    line-height:.9;

    font-weight:500;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #8fc7ff
        );

    -webkit-background-clip:text;

    color:transparent;

    margin:10px 0;

    text-shadow:
        0 0 25px rgba(60,140,255,.25);
}

.nombre{
    font-family:'Cormorant Garamond',serif;

    font-size:48px;

    letter-spacing:5px;

    color:#ffffff;

    text-shadow:
        0 0 15px rgba(90,160,255,.35);
}

.frase{
    margin-top:20px;

    font-size:13px;

    letter-spacing:2px;

    color:#c4dfff;
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .texto-superior{
        font-size:18px;
        letter-spacing:2px;
        margin-bottom:32px;
        padding:0 25px;
    }

    .sobre{
        width:290px;
        height:195px;
    }

    .numero{
        font-size:85px;
    }

    .nombre{
        font-size:36px;
        letter-spacing:3px;
    }

    .pequeno{
        font-size:20px;
    }
}
</style>
</head>

<body>

<!-- LUCES -->
<div class="luces">

    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>
    <div class="luz"></div>

</div>

<!-- PORTADA -->
<div class="portada" id="portada">

    <div class="texto-superior">
        ACOMPAÑAME EN ESTE DÍA INOLVIDABLE
    </div>

    <div class="sobre" id="sobre">

        <div class="hoja"></div>

        <div class="base"></div>

        <div class="tapa"></div>

        <div class="sello">
            15
        </div>

        <div class="texto-sobre">
            TOCA PARA ABRIR
        </div>

    </div>

</div>

<!-- MENSAJE DESPUÉS DE ABRIR -->

<div class="mensaje" id="mensaje">

    <div class="contenido">

        <div class="pequeno">
            Mis
        </div>

        <div class="numero">
            15
        </div>

        <div class="nombre">
            HILEANA LUCIA
        </div>

        <div class="frase">
            Una noche mágica está por comenzar
        </div>

    </div>

</div>

<script>

const sobre =
    document.getElementById("sobre");

const portada =
    document.getElementById("portada");

const mensaje =
    document.getElementById("mensaje");

sobre.addEventListener("click", function(){

    sobre.classList.add("abierto");

    setTimeout(function(){

        portada.classList.add("oculta");

        mensaje.classList.add("visible");

    },1100);

});

</script>

</body>
</html>
